<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <!-- Instagram Social Media Webpage Design -->

  <!-- Header start -->

  <header>
    <div class="container">
      <div class="navbar">
        <div class="nav_img">
          <img src="./asset/images/instagram_logo.png" alt="">
        </div>
        <div class="nav_items">
          <div class="nav_input">
            <input type="search" name="" id="" placeholder="search">
          </div>
          <div class="nav_btn">
            <button>Create a post</button>
          </div>
          <div class="bell_icon">
            <img src="./asset/images/bell.png" alt="">
            <span>1</span>
          </div>
        </div>
      </div>
    </div>
  </header>
  <!-- siderbar menu -->
  <section>
    <aside>
      <ul class="menu_items">
        <li>
          <img src="./asset/images/home-button.png" alt="">
          <a href="">Home</a>
        </li>
        <li>
          <img src="./asset/images/search.png" alt="">
          <a href="">Search</a>
        </li>
        <li>
          <img src="./asset/images/folder.png" alt="">
          <a href="">Explore</a>
        </li>
        <li>
          <img src="./asset/images/film-reel.png" alt="">
          <a href="">Reels</a>
        </li>
        <li>
          <img src="./asset/images/comments.png" alt="">
          <a href="">Messages</a>
        </li>
        <li>
          <img src="./asset/images/notification-bell.png" alt="">
          <a href="">Notifications</a>
        </li>
        <li>
          <img src="./asset/images/plus.png" alt="">
          <a href="">Create</a>
        </li>
        <li>
          <img src="./asset/images/dashboard.png" alt="">
          <a href="">Dashboard</a>
        </li>
        <li>
          <img src="./asset/images/user.png" alt="">
          <a href="">Profile</a>
        </li>
      </ul>
    </aside>
  </section>
</body>

</html>
